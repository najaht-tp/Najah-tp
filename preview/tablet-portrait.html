<!doctype html>
<meta charset="utf-8">
<title>Tablet portrait preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; background: #1b1d22; }
  body { display: grid; place-items: center; overflow: hidden; font: 13px system-ui, sans-serif; color: #9aa3ad; }
  .bar { position: fixed; top: 10px; left: 0; right: 0; text-align: center; letter-spacing: .04em; }
  .dev { --k: 1; width: 820px; height: 1180px; transform: scale(var(--k)); transform-origin: center; border: 12px solid #000; border-radius: 34px; box-shadow: 0 0 0 2px #3a3d44, 0 30px 80px rgba(0,0,0,.6); overflow: hidden; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #090f17; }
</style>
<div class="bar">iPad (A16) portrait · 820 × 1180</div>
<div class="dev" id="dev"><iframe src="../index.html" title="Portfolio in tablet portrait"></iframe></div>
<script>
  // scale the device to fit the window (never above 100%)
  const fit = () => { const k = Math.min(1, (innerHeight - 50) / 1204, (innerWidth - 20) / 844); document.getElementById('dev').style.setProperty('--k', k.toFixed(3)); };
  addEventListener('resize', fit); fit();
</script>
